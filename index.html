<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KULTURA</title>
  <meta name="description" content="KULTURA — kurs historii kultury do słuchania. Wielkie dzieła, wielkie idee i ludzie, którzy zmienili świat. Europa, Polska, Łódź.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KULTURA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a href="#/" class="brand" aria-label="KULTURA — strona główna">KULTURA<span class="brand-dot" aria-hidden="true"></span></a>
      <nav>
        <a href="#/" data-nav="home">Kurs</a>
        <a href="#/ustawienia" data-nav="settings">Głosy</a>
      </nav>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-foot">
    <div class="foot-in">
      <span class="brand small">KULTURA<span class="brand-dot" aria-hidden="true"></span></span>
      <span>Wielkie dzieła, wielkie idee i ludzie, którzy zmienili świat.</span>
    </div>
  </footer>

  <!-- Mini odtwarzacz widoczny na każdej stronie, gdy lekcja jest aktywna -->
  <div id="miniplayer" class="miniplayer" hidden>
    <button class="mp-toggle" data-action="toggle" aria-label="Odtwórz / pauza"></button>
    <a class="mp-info" href="#/">
      <span class="mp-title"></span>
      <span class="mp-sub"></span>
    </a>
    <button class="mp-car" data-action="car" aria-label="Tryb samochodowy" data-icon="car"></button>
  </div>

  <!-- Tryb samochodowy: duże przyciski, minimum tekstu -->
  <div id="carmode" class="carmode" hidden>
    <div class="car-top">
      <span class="brand">KULTURA<span class="brand-dot" aria-hidden="true"></span></span>
      <button class="car-close" data-action="car-close" aria-label="Zamknij tryb samochodowy" data-icon="close"></button>
    </div>
    <figure class="car-visual" data-action="car-img" hidden>
      <div class="cv-layer on"><img class="cv-bg" alt=""><img class="cv-img" alt=""></div>
      <div class="cv-layer"><img class="cv-bg" alt=""><img class="cv-img" alt=""></div>
      <figcaption><span class="cv-caption"></span><span class="cv-count"></span></figcaption>
    </figure>
    <div class="car-info">
    <div class="car-ep"></div>
    <div class="car-speaker"><span class="dot"></span><span class="name"></span></div>
    <div class="car-chapter"></div>
    <div class="car-progress"><div></div></div>
    </div>
    <div class="car-controls">
      <button data-action="prev-chapter" aria-label="Poprzedni rozdział" data-icon="prev"></button>
      <button data-action="back" aria-label="Cofnij" data-icon="back"></button>
      <button data-action="toggle" class="car-play" aria-label="Odtwórz / pauza"></button>
      <button data-action="forward" aria-label="Dalej" data-icon="forward"></button>
      <button data-action="next-chapter" aria-label="Następny rozdział" data-icon="next"></button>
    </div>
    <button class="car-ask" data-action="ask"><span data-icon="mic"></span>Zadaj pytanie</button>
  </div>

  <dialog id="askdlg" class="askdlg">
    <form method="dialog" class="ask-inner">
      <div class="eyebrow">Pytanie</div>
      <h2>Zapytaj prowadzących</h2>
      <p class="ask-hint">Lekcja jest wstrzymana. Zadaj pytanie głosem lub wpisz je. Odpowiedź zostanie przeczytana, a potem wrócimy do wykładu.</p>
      <div class="ask-row">
        <button type="button" class="ask-mic" data-action="mic">Mów</button>
        <input name="q" class="ask-q" placeholder="np. Dlaczego Gierek inwestował w wielką płytę?" autocomplete="off">
      </div>
      <div class="ask-answer" aria-live="polite"></div>
      <div class="ask-actions">
        <button type="button" class="btn ghost" data-action="ask-resume">Wróć do lekcji</button>
        <button type="button" class="btn" data-action="ask-send">Zapytaj</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
